apiVersion: v1
kind: Pod
metadata:
  name: mtu-test
spec:
  containers:
  - name: probe
    image: registry.redhat.io/rhel9/support-tools:latest
    command: ["sleep", "infinity"]
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop: ["ALL"]
