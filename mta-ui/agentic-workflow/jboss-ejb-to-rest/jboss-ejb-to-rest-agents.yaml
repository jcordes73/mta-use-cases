# The JBoss EAP EJB-to-REST migration agents: one Agent per workflow stage,
# mirroring the citrus-tests plan/author/verify pattern - each stage's
# sandbox loads only its own stage skill (type: rule, always in the
# prompt). All three agents run the same mta-jboss-ejb-to-rest-agent image,
# which bakes the three stage skills and the original refactoring guide
# (with its worked example for calibration). No gateways: the
# AgentRun/AgentWorkflowRun names the gateway at run time.
#
# Build the image first (the documented binary-build pattern, as for
# mta-citrus-tests-agent):
#   oc new-build --name mta-jboss-ejb-to-rest-agent --strategy=docker --binary -n openshift-mta
#   oc patch bc mta-jboss-ejb-to-rest-agent -n openshift-mta --type=json \
#     -p='[{"op":"add","path":"/spec/strategy/dockerStrategy/dockerfilePath","value":"Containerfile"}]'
#   oc start-build mta-jboss-ejb-to-rest-agent -n openshift-mta \
#     --from-dir=mta-ui/agentic-workflow/jboss-ejb-to-rest --follow
#   oc apply -f mta-ui/agentic-workflow/jboss-ejb-to-rest/skills/jboss-ejb-to-rest-skillcards.yaml
#   oc apply -f mta-ui/agentic-workflow/jboss-ejb-to-rest/jboss-ejb-to-rest-agents.yaml
---
apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: jboss-ejb-to-rest-plan-agent
  namespace: openshift-mta
  labels:
    konveyor.io/managed: "true"
spec:
  image: image-registry.openshift-image-registry.svc:5000/openshift-mta/mta-jboss-ejb-to-rest-agent:latest
  skillCards:
    - ref: jboss-ejb-to-rest-plan
  execution:
    maxTurns: 150
---
apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: jboss-ejb-to-rest-author-agent
  namespace: openshift-mta
  labels:
    konveyor.io/managed: "true"
spec:
  image: image-registry.openshift-image-registry.svc:5000/openshift-mta/mta-jboss-ejb-to-rest-agent:latest
  skillCards:
    - ref: jboss-ejb-to-rest-author
  execution:
    maxTurns: 250
---
apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: jboss-ejb-to-rest-verify-agent
  namespace: openshift-mta
  labels:
    konveyor.io/managed: "true"
spec:
  image: image-registry.openshift-image-registry.svc:5000/openshift-mta/mta-jboss-ejb-to-rest-agent:latest
  skillCards:
    - ref: jboss-ejb-to-rest-verify
  execution:
    maxTurns: 150
