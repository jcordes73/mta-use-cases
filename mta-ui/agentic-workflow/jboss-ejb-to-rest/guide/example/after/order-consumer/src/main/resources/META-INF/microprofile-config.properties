# EXAMPLE ONLY — per-environment MicroProfile Config for the REST clients (§3.2/§3.5).
# The existing SOAP call sites (OrderProcessor) keep their WSDL-driven configuration;
# this file configures the NEW REST call sites (ReportingProcessor, §2.6). In
# production, override per environment, e.g.:
#   com.acme.order.rest.CustomerServiceClient/mp-rest/url=${CUSTOMER_BASE_URI}
com.acme.order.rest.CustomerServiceClient/mp-rest/url=https://customer-app:8443
com.acme.order.rest.CustomerServiceClient/mp-rest/connectTimeout=2000
com.acme.order.rest.CustomerServiceClient/mp-rest/readTimeout=5000

# Auth (§3.5): the bearer token is attached per request via a ClientHeadersFactory or
# at injection time; credentials come from the platform/IdP, never this file. TLS only.
