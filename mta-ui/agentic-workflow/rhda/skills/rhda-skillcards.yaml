# SkillCards for the RHDA agent.
#
# One SkillCard per skill in the mta-rhda-agent image (each skill is one
# directory at the image root; a SkillCard is always one skill, so subPath
# selects which - same layout as the migiq skillcards). Built and pushed by
# the mta-rhda-agent BuildConfig (see the folder Containerfile).
---
apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: rhda-cve-scan
  namespace: openshift-mta
spec:
  image: image-registry.openshift-image-registry.svc:5000/openshift-mta/mta-rhda-agent:latest
  displayName: RHDA Skill - rhda-cve-scan
  version: "0.1.0"
  description: "Detects CVEs and vulnerable dependencies in a Maven-based Java project by scanning pom.xml files with Red Hat Dependency Analytics (RHDA), and audits the licenses declared in the poms by translating them to the SPDX identifiers RHDA recognizes. Use when the user asks to scan dependencies for vulnerabilities, find CVEs, check dependency security, assess whether the project's Maven dependencies are affected by known vulnerabilities, or check/translate the licenses declared in a pom.xml. Triggers on phrases like \\\"scan for CVEs\\\", \\\"check dependencies for vulnerabilities\\\", \\\"security scan\\\", \\\"which CVEs affect this project\\\", \\\"vulnerable dependencies\\\", \\\"check licenses\\\", \\\"license compliance\\\", or any mention of CVEs or licenses in the context of Maven/pom.xml. Requires the rhda MCP tools (analyze_dependency_vulnerabilities, explain_vulnerability, generate_remediation_plan, suppress_dependency_vulnerability)."
  type: skill
  subPath: rhda-cve-scan
  tags:
    - security
    - rhda
    - maven
    - cve
