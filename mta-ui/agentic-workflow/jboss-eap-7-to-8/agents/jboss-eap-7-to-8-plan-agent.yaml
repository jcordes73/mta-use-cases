apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: jboss-eap-7-to-8-plan-agent
  namespace: openshift-mta
  labels:
    konveyor.io/managed: "true"
spec:
  # Derived image (plan-agent-image/Containerfile): stock mta-agent-java +
  # the hub-report entrypoint wrapper and eap-hub-report.py reporter, so the
  # plan stage can report its migration findings to the MTA Hub (the same
  # mechanism as the rhda agent image). The execute and verify agents keep
  # the stock image - their sandboxes get no Hub token file, so the reporter
  # no-ops there.
  image: image-registry.openshift-image-registry.svc:5000/openshift-mta/mta-jboss-eap-7-to-8-plan-agent:latest
  skillCards:
    - ref: plan
    - ref: jboss-eap-7-to-8
  execution:
    maxTurns: 200
