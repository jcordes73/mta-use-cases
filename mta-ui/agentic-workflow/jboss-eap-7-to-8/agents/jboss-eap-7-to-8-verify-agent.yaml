apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: jboss-eap-7-to-8-verify-agent
  namespace: openshift-mta
  labels:
    konveyor.io/managed: "true"
spec:
  image: registry.redhat.io/mta/mta-agent-java-rhel9:8.3.1
  skillCards:
    # commit-when-done: a type: rule card (see mta-ui/agentic-rules/) - always-loaded
    # commit instruction; without it a stage can end with uncommitted output
    # and push nothing (the harness pushes committed work only).
    - ref: commit-when-done
    - ref: verify
    - ref: jboss-eap-7-to-8
  execution:
    maxTurns: 200
