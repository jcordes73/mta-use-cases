apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: spring-boot-to-quarkus-plan-agent
  namespace: openshift-mta
  labels:
    app.kubernetes.io/managed-by: agentic-controller-defaults
    konveyor.io/managed: "true"
spec:
  image: registry.redhat.io/mta/mta-agent-java-rhel9:8.3.1
  skillCards:
    - ref: plan
    - ref: spring-boot-to-quarkus
  execution:
    maxTurns: 200
