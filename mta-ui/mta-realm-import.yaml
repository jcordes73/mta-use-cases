apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: mta-realm-import
  namespace: openshift-mta
spec:
  keycloakCRName: mta-rhbk
  realm:
    realm: mta
    enabled: true
    # firstName and lastName are optional for Keycloak users - they are omitted
    # here. Add them to the user below (or to additional users) only when needed.
    users:
      - username: admin
        email: admin@example.com
        emailVerified: true
        # Imported users default to DISABLED - without enabled: true the login
        # fails with "Account is disabled, contact your administrator." (the
        # import also resets this on every re-apply).
        enabled: true
        # The MTA UI login (admin/admin per the README). Imported users have no
        # credentials unless they are defined here - without this entry the
        # login fails with "Invalid username or password".
        credentials:
          - type: password
            value: admin
            temporary: false
    # The +role.admin client scope: the Hub expands +role.<name> references
    # from the IdP access token's scope claim into the named hub role's
    # permission scopes (see the mta-ui client's defaultClientScopes below).
    clientScopes:
      - name: "+role.admin"
        description: "Hub admin role reference: the Hub expands +role.<name> scopes from the IdP access token into the named hub role permissions"
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
      # The built-in OpenID Connect client scopes. The realm import creates a bare
      # realm that does NOT get Keycloak's default client-scope seeding, so without
      # these every login requesting `openid profile email` fails with
      # "IdP error: invalid_scope - Invalid scopes: openid profile email".
      - name: profile
        description: 'OpenID Connect built-in scope: profile'
        protocol: openid-connect
        attributes:
          include.in.token.scope: 'true'
          consent.screen.text: ${profileScopeConsentText}
          display.on.consent.screen: 'true'
        protocolMappers:
        - name: website
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: website
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: website
            jsonType.label: String
        - name: full name
          protocol: openid-connect
          protocolMapper: oidc-full-name-mapper
          consentRequired: false
          config:
            id.token.claim: 'true'
            introspection.token.claim: 'true'
            access.token.claim: 'true'
            userinfo.token.claim: 'true'
        - name: profile
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: profile
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: profile
            jsonType.label: String
        - name: given name
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: firstName
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: given_name
            jsonType.label: String
        - name: picture
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: picture
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: picture
            jsonType.label: String
        - name: birthdate
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: birthdate
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: birthdate
            jsonType.label: String
        - name: nickname
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: nickname
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: nickname
            jsonType.label: String
        - name: locale
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: locale
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: locale
            jsonType.label: String
        - name: updated at
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: updatedAt
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: updated_at
            jsonType.label: long
        - name: zoneinfo
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: zoneinfo
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: zoneinfo
            jsonType.label: String
        - name: middle name
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: middleName
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: middle_name
            jsonType.label: String
        - name: gender
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: gender
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: gender
            jsonType.label: String
        - name: username
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: username
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: preferred_username
            jsonType.label: String
        - name: family name
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: lastName
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: family_name
            jsonType.label: String
      - name: email
        description: 'OpenID Connect built-in scope: email'
        protocol: openid-connect
        attributes:
          include.in.token.scope: 'true'
          consent.screen.text: ${emailScopeConsentText}
          display.on.consent.screen: 'true'
        protocolMappers:
        - name: email verified
          protocol: openid-connect
          protocolMapper: oidc-usermodel-property-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: emailVerified
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: email_verified
            jsonType.label: boolean
        - name: email
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: email
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: email
            jsonType.label: String
      - name: roles
        description: OpenID Connect scope for add user roles to the access token
        protocol: openid-connect
        attributes:
          include.in.token.scope: 'false'
          consent.screen.text: ${rolesScopeConsentText}
          display.on.consent.screen: 'true'
        protocolMappers:
        - name: audience resolve
          protocol: openid-connect
          protocolMapper: oidc-audience-resolve-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            access.token.claim: 'true'
        - name: client roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-client-role-mapper
          consentRequired: false
          config:
            user.attribute: foo
            introspection.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: resource_access.${client_id}.roles
            jsonType.label: String
            multivalued: 'true'
        - name: realm roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          consentRequired: false
          config:
            user.attribute: foo
            introspection.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: realm_access.roles
            jsonType.label: String
            multivalued: 'true'
      - name: web-origins
        description: OpenID Connect scope for add allowed web origins to the access token
        protocol: openid-connect
        attributes:
          include.in.token.scope: 'false'
          consent.screen.text: ''
          display.on.consent.screen: 'false'
        protocolMappers:
        - name: allowed web origins
          protocol: openid-connect
          protocolMapper: oidc-allowed-origins-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            access.token.claim: 'true'
      - name: basic
        description: OpenID Connect scope for add all basic claims to the token
        protocol: openid-connect
        attributes:
          include.in.token.scope: 'false'
          display.on.consent.screen: 'false'
        protocolMappers:
        - name: auth_time
          protocol: openid-connect
          protocolMapper: oidc-usersessionmodel-note-mapper
          consentRequired: false
          config:
            user.session.note: AUTH_TIME
            id.token.claim: 'true'
            introspection.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: auth_time
            jsonType.label: long
        - name: sub
          protocol: openid-connect
          protocolMapper: oidc-sub-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            access.token.claim: 'true'
    clients:
      - clientId: mta-ui
        name: MTA UI
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        # The base URL is a valid redirect URI so the UI's logout
        # post_logout_redirect_uri (the app's base URL) is accepted: with
        # post.logout.redirect.uris = "+", Keycloak validates post-logout
        # URIs against the client's registered redirect URIs.
        attributes:
          post.logout.redirect.uris: "+"
        # The +role.admin client scope puts a +role.<name> reference into
        # the IdP access token's scope claim; the Hub expands it into the
        # named hub role's permission scopes for the federated identity.
        # Without it the hub session has no hub scopes and every Hub API
        # call fails with "Required scope not granted: <resource>:<verb>".
        defaultClientScopes:
          - "+role.admin"
          - profile
          - email
          - roles
        redirectUris:
          - "https://mta-openshift-mta.${OPENSHIFT_APPS_DOMAIN}/oidc/idp/callback"
          - "https://mta-openshift-mta.${OPENSHIFT_APPS_DOMAIN}/"
          - "https://mta-openshift-mta.${OPENSHIFT_APPS_DOMAIN}"
        webOrigins:
          - "https://mta-openshift-mta.${OPENSHIFT_APPS_DOMAIN}"
      - clientId: gitea
        name: Gitea
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        defaultClientScopes:
          - profile
          - email
          - roles
        secret: gitea-client-secret
        redirectUris:
          - "https://git.${OPENSHIFT_APPS_DOMAIN}/user/oauth2/keycloak/callback"
        webOrigins:
          - "https://git.${OPENSHIFT_APPS_DOMAIN}"
