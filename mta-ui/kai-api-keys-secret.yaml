apiVersion: v1
kind: Secret
metadata:
  name: kai-api-keys
  namespace: openshift-mta
type: Opaque
# The secret's keys become the environment variable names injected into the
# kai-api and LLM-proxy pods (see the "Create the Model Secret" section of the
# README). Apply with the same envsubst pattern as the other LLM secrets:
#   cat mta-ui/kai-api-keys-secret.yaml | envsubst | oc apply -f -
stringData:
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
