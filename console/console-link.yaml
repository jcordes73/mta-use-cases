# ConsoleLink: an MTA entry in the OpenShift web console's application menu
# (the grid launcher in the masthead), so the MTA UI is reachable without
# knowing the route URL. Cluster-scoped and visible to all console users;
# deleting the resource removes the entry. The href carries the
# ${OPENSHIFT_APPS_DOMAIN} placeholder - apply with envsubst like the other
# templated manifests (applying with plain `oc apply -f -` would store the
# placeholder literally).
apiVersion: console.openshift.io/v1
kind: ConsoleLink
metadata:
  name: mta-ui
spec:
  href: 'https://mta-openshift-mta.${OPENSHIFT_APPS_DOMAIN}'
  location: ApplicationMenu
  text: Migration Toolkit for Applications (MTA)
  applicationMenu:
    section: Red Hat Applications
