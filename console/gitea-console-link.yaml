# ConsoleLink: a Gitea entry in the OpenShift web console's application menu
# (the grid launcher in the masthead), mirroring the MTA UI entry in
# console-link.yaml - see that file for the general mechanism (cluster-scoped,
# ${OPENSHIFT_APPS_DOMAIN} placeholder, apply with envsubst).
#
# The icon is Gitea's own favicon (assets/img/favicon.png served by the gitea
# route, fetched from the live deployment) embedded as a PNG data URI - the
# application launcher requires either a data URI or a URL reachable by the
# browser without authentication.
apiVersion: console.openshift.io/v1
kind: ConsoleLink
metadata:
  name: gitea
spec:
  href: 'https://git.${OPENSHIFT_APPS_DOMAIN}'
  location: ApplicationMenu
  text: Gitea (Git)
  applicationMenu:
    section: Red Hat Applications
    imageURL: 'data:image/png;base64,'
