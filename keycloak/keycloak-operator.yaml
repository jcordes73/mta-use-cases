apiVersion: v1
kind: Namespace
metadata:
  name: openshift-mta
---
# The same OperatorGroup the MTA operator uses (mta-ui/mta-operator.yaml) -
# applying both manifests is idempotent, the objects are identical.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: mta-operator-group
  namespace: openshift-mta
spec:
  targetNamespaces:
  - openshift-mta
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: openshift-mta
spec:
  channel: stable-v26
  installPlanApproval: Automatic
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # The CSV that served from the catalog at validation time. Remove this
  # line (or bump it) to install a newer operator version from the channel.
  startingCSV: rhbk-operator.v26.6.7-opr.3
