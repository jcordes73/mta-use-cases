gitea:
  admin:
    username: gitea-admin
    password: "giteaftw!"
    email: "gitea@example.com"
    passwordMode: keepUpdated
  config:
    server:
      # The username the built-in SSH server requires for git operations.
      # Defaults to the OS user running Gitea — on OpenShift that is the
      # random container UID (e.g. 1000810000), so pin it to `git`.
      BUILTIN_SSH_SERVER_USER: git
      # The user shown in the UI's SSH clone URLs.
      SSH_USER: git
postgresql:
  enabled: true
postgresql-ha:
  enabled: false
valkey:
  enabled: true
  architecture: standalone
valkey-cluster:
  enabled: false
openshift:
  enabled: true
route:
  enabled: true
  host: git.${OPENSHIFT_APPS_DOMAIN}
  tls:
    termination: edge
