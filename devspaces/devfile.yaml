schemaVersion: 2.2.0
metadata:
  name: mta-migration-workspace
# Disables the DevWorkspace Operator's project-clone init container: the factory
# resolution injects the repository containing this devfile (mta-use-cases) as the
# project source, and without this attribute that repository would be cloned into
# /projects on every start. The application source to be migrated is cloned
# exclusively by the clone-git postStart command below.
#
# The storage-type attribute forces per-user (persistent) storage: this devfile is
# also served as the registry sample tagged "Empty" (the dashboard's default devfile),
# and the dashboard forces perclick (ephemeral) storage for Empty-tagged samples -
# without the attribute every workspace start would get fresh storage.
attributes:
  controller.devfile.io/project-clone: disable
  controller.devfile.io/storage-type: per-user
# The OPENAI_* environment variables used by the configure-opencode command are
# provided by the llm-credentials Secret mounted into the workspace
# (see devspaces/llm-credentials-secret.yaml).
# IDE-specific customization is not allowed on container components (devfile v2 removed it),
# and a .vscode/extensions.json devfile attribute is not honored by che-code. Extensions are
# installed deterministically via the install-extensions postStart command using the
# che-code CLI (a .vscode/extensions.json file in the cloned project repo only produces
# a recommendation prompt, scanned at editor startup).
components:
  - name: tools
    container:
      # A dev image with a shell entry point is required - the ubi9/openjdk-21 runtime
      # image's entry point runs run-java.sh, which expects a JAR in /deployments and
      # crashes the workspace container. The UDI ships OpenJDK, Maven, and the CLI tools.
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryLimit: 4Gi
      mountSources: true
commands:
  - id: install-extensions
    exec:
      component: tools
      # Deterministic extension install via the che-code CLI. The .vscode/extensions.json
      # recommendation file is not honored at postStart time (recommendations are scanned
      # at editor startup) and VS Code only prompts for workspace recommendations.
      # Extensions install into /checode/remote/extensions on the per-user PVC (persisted);
      # the CLI needs the bundled Node libs when run outside the editor entrypoint.
      commandLine: |
        export LD_LIBRARY_PATH=/checode/checode-linux-libc/ubi9/ld_libs/openssl:/checode/checode-linux-libc/ubi9/ld_libs/core:/usr/lib64
        /checode/checode-linux-libc/ubi9/bin/che-code \
          --user-data-dir /checode/remote/data --extensions-dir /checode/remote/extensions \
          --install-extension redhat.mta-vscode-extension
        /checode/checode-linux-libc/ubi9/bin/che-code \
          --user-data-dir /checode/remote/data --extensions-dir /checode/remote/extensions \
          --install-extension sst-dev.opencode
  - id: install-opencode
    exec:
      component: tools
      commandLine: curl -fsSL https://opencode.ai/install | bash
  - id: configure-opencode
    exec:
      component: tools
      commandLine: |
        mkdir -p ~/.config/opencode
        cat <<EOF > ~/.config/opencode/opencode.json
        {
          "\$schema": "https://opencode.ai/config.json",
          "model": "custom-llm/${OPENAI_MODEL_NAME}",
          "providers": {
            "custom-llm": {
              "name": "Custom LLM",
              "env": ["OPENAI_API_KEY"],
              "package": "@opencode/ai/providers/openai-compatible",
              "settings": {
                "baseURL": "${OPENAI_BASE_URL}"
              },
              "models": {
                "${OPENAI_MODEL_NAME}": {
                  "name": "${OPENAI_MODEL_NAME}"
                }
              }
            }
          }
        }
        EOF
  - id: configure-mta-settings
    exec:
      component: tools
      # Writes the MTA plugin settings into the che-code machine-level settings file
      # (/checode/remote/data/Machine/settings.json), which is persisted on the per-user
      # PVC and applies to all workspace folders. The existing settings (e.g.
      # git.defaultCloneDirectory, set by Dev Spaces) are merged, not overwritten.
      commandLine: |
        mkdir -p /checode/remote/data/Machine
        [ -f /checode/remote/data/Machine/settings.json ] || echo '{}' > /checode/remote/data/Machine/settings.json
        cat <<'EOF' > /tmp/mta-settings.json
        {
          "mta-core.genai.enabled": true,
          "mta-core.genai.agentMode": true
        }
        EOF
        jq -s '.[0] * .[1]' /checode/remote/data/Machine/settings.json /tmp/mta-settings.json > /tmp/mta-settings-merged.json \
          && mv /tmp/mta-settings-merged.json /checode/remote/data/Machine/settings.json
        rm -f /tmp/mta-settings.json
  - id: clone-git
    exec:
      component: tools
      # Clones the application source to be migrated from the Gitea instance into
      # /projects, using the PROJECT_REPO_URL variable provided by the clone-config
      # Secret mounted as env (see devspaces/git-clone-secret.yaml). Env variables are
      # expanded in exec commandLines (the command runs via a shell) - unlike the
      # devfile projects remotes, which the DevWorkspace Operator resolves as literal
      # arguments before any container exists. SSH auth relies on the git-ssh-key
      # Secret's key files mounted at /etc/ssh/ and the git-ssh-proxy Secret's
      # ProxyCommand mounted at /etc/ssh/ssh_config.d/ - see the README's
      # "Git Authentication with SSH Keys" section. The target
      # directory is derived from the URL's last path segment (without .git), so
      # changing PROJECT_REPO_URL requires no command change. Idempotent:
      # clones on first start, pulls on restarts (/projects persists on the per-user PVC).
      commandLine: |
        REPO_NAME=$(basename "${PROJECT_REPO_URL%/}" .git)
        if [ -d "/projects/${REPO_NAME}/.git" ]; then
          git -C "/projects/${REPO_NAME}" pull --ff-only
        else
          git clone "${PROJECT_REPO_URL}" "/projects/${REPO_NAME}"
        fi
events:
  postStart:
    - install-extensions
    - install-opencode
    - configure-opencode
    - configure-mta-settings
    - clone-git
