# Static devfile registry served by an Apache HTTP Server container.
# The dashboard fetches external registries via its backend data-resolver proxy
# (no CORS needed) and expects the sample index at <url>/devfiles/index.json
# (it first tries <url>/index/all, which 404s here, then falls back).
# Relative `links.v2` paths in the index are resolved against the registry base URL.
#
# The content ConfigMap is generated by kustomization.yaml (in this directory)
# directly from devspaces/devfile.yaml and registry-index.json - no manual copy
# to keep in sync. Apply this directory with: oc apply -k devspaces/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devfile-registry
  namespace: openshift-devspaces
  labels:
    app: devfile-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devfile-registry
  template:
    metadata:
      labels:
        app: devfile-registry
    spec:
      containers:
        - name: httpd
          # Red Hat's OpenShift-native httpd image: listens on 8080 and runs as an
          # arbitrary (non-root) UID, working with the cluster's restricted SCC -
          # the stock httpd image cannot bind port 80 under the SCC.
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            # Serves <url>/devfiles/index.json and <url>/devfiles/<name>/devfile.yaml.
            # The generated ConfigMap's file keys are remapped here: the sample devfile
            # sits one level deeper than the classic layout (links.v2 points to it
            # directly).
            - name: content
              mountPath: /var/www/html/devfiles
              readOnly: true
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
      volumes:
        # kustomize rewrites this name reference to the content-hashed generated
        # ConfigMap name, so any devfile or index change rolls the registry pod
        # immediately (no kubelet ConfigMap sync delay).
        - name: content
          configMap:
            name: devfile-registry-content
            items:
              - key: registry-index.json
                path: index.json
              - key: devfile.yaml
                path: mta-migration-workspace/devfile.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: devfile-registry
  namespace: openshift-devspaces
  labels:
    app: devfile-registry
spec:
  selector:
    app: devfile-registry
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: devfile-registry
  namespace: openshift-devspaces
spec:
  to:
    kind: Service
    name: devfile-registry
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
