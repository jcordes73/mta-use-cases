apiVersion: v1
kind: Secret
metadata:
  name: hub-config
  namespace: <workspace-namespace>
  labels:
    controller.devfile.io/mount-to-devworkspace: 'true'
    controller.devfile.io/watch-secret: 'true'
  annotations:
    controller.devfile.io/mount-as: env
type: Opaque
stringData:
  # The MTA VS Code extension's hub connection, provided as environment
  # variables. The extension stores its hub config in VS Code secret storage
  # (edited via the "Configure Hub Settings" dialog) but reads these env vars
  # at activation and they override the stored config - so the workspace
  # connects to the hub out of the box without any manual dialog steps
  # (see the extension's hubConfigStorage.ts: HUB_URL/HUB_USERNAME/
  # HUB_PASSWORD/FORCE_HUB_ENABLED/HUB_INSECURE/HUB_SOLUTION_SERVER_ENABLED/
  # HUB_PROFILE_SYNC_ENABLED).
  # The MTA UI route - the extension appends the hub API paths itself.
  HUB_URL: "https://mta-openshift-mta.${OPENSHIFT_APPS_DOMAIN}"
  # The MTA UI credentials (Keycloak mta realm, see the "MTA for Keycloak"
  # installation step).
  HUB_USERNAME: "${HUB_USERNAME}"
  HUB_PASSWORD: "${HUB_PASSWORD}"
  # The route certificate is the cluster's self-signed CA - skip verification.
  HUB_INSECURE: "true"
  # Always enable the hub connection (independent of any stored dialog state).
  FORCE_HUB_ENABLED: "true"
  # Solution Server (LLM proxy for Developer Lightspeed) and profile sync -
  # the extension defaults both to enabled; set them explicitly for clarity.
  HUB_SOLUTION_SERVER_ENABLED: "true"
  HUB_PROFILE_SYNC_ENABLED: "true"
