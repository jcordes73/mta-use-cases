apiVersion: v1
kind: Secret
metadata:
  name: clone-config
  namespace: <workspace-namespace>
  labels:
    controller.devfile.io/mount-to-devworkspace: 'true'
    controller.devfile.io/watch-secret: 'true'
  annotations:
    controller.devfile.io/mount-as: env
type: Opaque
stringData:
  # The SSH clone URL consumed by the devfile's clone-git postStart command.
  # Port 443 is required (TLS-passthrough Route, see the README's "Git Authentication
  # with SSH Keys" section); the scp-like git@host:path syntax cannot carry a port.
  # SSH auth itself relies on the git-ssh-key Secret's key files mounted at /etc/ssh/
  # and the git-ssh-proxy Secret's ProxyCommand (mounted at /etc/ssh/ssh_config.d/).
  PROJECT_REPO_URL: "${PROJECT_REPO_URL}"
  # The branch to clone/track. Without it the clone lands on the repository's
  # default branch (8.1.x for jboss-quickstarts) instead of the branch the MTA
  # application records import (7.4.x, see the application import template).
  PROJECT_REPO_BRANCH: "${PROJECT_REPO_BRANCH}"
  # The HTTPS web URL under which the MTA hub application records carry the
  # repository. clone-git presents this as the git remote (so the MTA IDE
  # extension's profile sync matches the hub records exactly) while keeping
  # SSH as the push transport via a url.<ssh>.pushInsteadOf rewrite - see the
  # devfile's clone-git command and the "Git Authentication with SSH Keys"
  # section.
  PROJECT_REPO_WEB_URL: "${PROJECT_REPO_WEB_URL}"
  # The repository-relative path of the application whose hub application
  # record the workspace folder should match (the Repository Path column of
  # the application import template). clone-git adds the application subfolder
  # (instead of the repository root) to the editor's workspace: the MTA IDE
  # extension supports a single workspace folder only, and its profile sync
  # disambiguates multiple hub applications by the folder's path relative to
  # the repository root - with the repository root open the sync fails with
  # "Multiple Hub applications found for this repository, but workspace is at
  # repository root" and no hub profiles download.
  PROJECT_REPO_PATH: "${PROJECT_REPO_PATH}"
