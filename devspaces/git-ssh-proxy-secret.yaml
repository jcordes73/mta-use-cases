apiVersion: v1
kind: Secret
metadata:
  name: git-ssh-proxy
  namespace: <workspace-namespace>
  labels:
    controller.devfile.io/mount-to-devworkspace: 'true'
    controller.devfile.io/watch-secret: 'true'
  annotations:
    controller.devfile.io/mount-path: /etc/ssh/ssh_config.d/
    controller.devfile.io/mount-as: subpath
type: Opaque
stringData:
  # The ssh_config in the git-ssh-key Secret is auto-generated (and any custom value
  # reverted) by the Dev Spaces server's SshConfigConfigurator, so the TLS-unwrapping
  # ProxyCommand must live in a separate file included via the generated config's
  # "Include /etc/ssh/ssh_config.d/*.conf" line. Scoped to the Gitea SSH route host
  # pattern so other SSH hosts are unaffected.
  99-git-proxy.conf: |
    Host git-ssh.*
      ProxyCommand openssl s_client -quiet -connect %h:%p -servername %h
