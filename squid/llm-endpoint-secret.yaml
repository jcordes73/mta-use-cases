# Host of the OpenCode LLM endpoint, allowlisted in the Squid proxy config.
# Created with the same envsubst pattern as the Dev Spaces secrets:
#   export OPENAI_HOST="maas.apps.<cluster-domain>"
#   cat squid/llm-endpoint-secret.yaml | envsubst | oc apply -f -
# The Squid pod lives in the squid namespace, so it cannot reference the
# llm-credentials Secret of the workspace namespace (cross-namespace Secret
# references are not allowed) - it gets its own copy of the host here.
apiVersion: v1
kind: Secret
metadata:
  name: llm-endpoint
  namespace: squid
type: Opaque
stringData:
  OPENAI_HOST: "${OPENAI_HOST}"
